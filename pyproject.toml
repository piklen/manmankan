[project]
name = "manmankan"
version = "0.0.6.9.28"
description = "普通 A 股散户的本地观察台 · 今日变化、自选、持仓与位置一处看清"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "piklen" },
]
readme = "README.md"
keywords = [
    "stock", "a-share", "retail-investor", "local-web", "data-analysis",
    "position", "scanner", "akshare", "tushare", "中国股市",
    "watchlist", "portfolio", "stock-screener", "terminal", "baostock", "A股", "自选股",
    "ai-data-layer", "data-middleware", "agent-native", "mcp", "mcp-server",
    "model-context-protocol", "ai-agent", "agent-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Topic :: Office/Business :: Financial",
    "Topic :: Utilities",
    "Natural Language :: Chinese (Simplified)",
]

dependencies = [
    "akshare==1.18.64",  # 数据源 SDK 精确 pin · 降低上游投毒 / API 漂移面
    "pandas>=2.0,<3",  # 避免提前吃 pandas 3.x 行为变更
    "pydantic>=2.13.4,<3",
    "rich>=13.0,<16",
    "typer>=0.12,<0.26",  # 0.26.x 让 TTY help 首帧超出 100ms SLO，修复前先收紧
    "fastapi>=0.139.0,<0.140",  # 本地 Web 服务端路由 · 窄范围避免 Starlette 契约漂移
    "uvicorn>=0.32,<0.52",  # 本地 Web ASGI 运行时 · 只监听 127.0.0.1
    "jinja2>=3.1,<3.2",  # 服务端 HTML 模板渲染 · 不引入 node/npm 工具链
    "pyarrow>=15.0,<25",  # pandas 读写 parquet 的运行时依赖
    "baostock==0.9.3",  # 数据源 SDK 精确 pin · 降低上游 API 漂移面
    "numpy>=2.4.6,<2.5",  # 间接 → 直接依赖 · 控制版本面 · 防 macOS Gatekeeper .so 签名问题
]

[project.urls]
Homepage = "https://piklen.github.io/manmankan/"
Repository = "https://github.com/piklen/manmankan"
Issues = "https://github.com/piklen/manmankan/issues"
Changelog = "https://github.com/piklen/manmankan/blob/main/CHANGELOG.md"

[project.scripts]
kan = "kan._entry:main"
kan-mcp = "kan.mcp.server:main"

[dependency-groups]
dev = [
    "diff-cover>=9.0",
    "httpx>=0.28,<0.29",  # FastAPI TestClient 依赖 · Web 层只跑本地测试
    "mypy>=2.1.0,<3",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line-too-long (中文 docstring 换行难，line-length=100 已够)
    "RUF001",  # 中文全角标点 (， 。 ：) — 中文 CLI 必然产物
    "RUF002",  # docstring 全角标点 — 同上
    "RUF003",  # comment 全角标点 — 同上
]

[tool.ruff.lint.per-file-ignores]
# test 函数名含 env var 名 (e.g., _KAN_COMPLETE / _TYPER_COMPLETE_ARGS) 是有意大写
# 保留 env var 字面量在函数名里 · 比改成 lowercase 更可读
"tests/test_atexit_completion_isolation.py" = ["N802"]

[tool.mypy]
python_version = "3.11"
files = ["kan/core", "kan/service", "kan/storage/export.py", "kan/data/updater.py", "kan/data/source_chain.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tty: true terminal PTY tests for Rich spinner/progress first-frame SLO",
    "network: 真网络冒烟 case · 默认 CI 跳 · 用 -m network 单独跑",
]

[tool.coverage.run]
source = ["kan"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.hatch.build.targets.wheel]
packages = ["kan"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
