[project]
name = "manmankan"
version = "0.0.6.9"
description = "A股行情翻译官 · 先看清再决定 · 散户看得清，AI 调得动"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "piklen" },
]
readme = "README.md"
keywords = [
    "stock", "a-share", "cli", "json", "ai-workflow", "data-analysis",
    "position", "scanner", "akshare", "tushare", "中国股市",
    "watchlist", "stock-screener", "terminal", "baostock", "A股", "自选股",
    "ai-data-layer", "data-middleware", "agent-native", "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Utilities",
    "Natural Language :: Chinese (Simplified)",
]

dependencies = [
    "akshare==1.18.60",  # 数据源 SDK 精确 pin · 降低上游投毒 / API 漂移面
    "pandas>=2.0,<3",  # 避免提前吃 pandas 3.x 行为变更
    "pydantic>=2.0,<3",
    "rich>=13.0,<16",
    "typer>=0.12,<0.27",
    "pyarrow>=15.0,<25",  # pandas 读写 parquet 的运行时依赖
    "baostock==0.9.1",  # 数据源 SDK 精确 pin · 与 adata 同级别收敛
    "numpy>=1.26,<2.5",  # 间接 → 直接依赖 · 控制版本面 · 防 macOS Gatekeeper .so 签名问题
    "adata==2.9.5",  # 题材位置扫描 · 同花顺 catalog/成分股 + 东财 K 线/反查 · pin 防上游投毒
]

[project.urls]
Homepage = "https://piklen.github.io/manmankan/"
Repository = "https://github.com/piklen/manmankan"
Issues = "https://github.com/piklen/manmankan/issues"
Changelog = "https://github.com/piklen/manmankan/blob/main/CHANGELOG.md"

[project.scripts]
kan = "kan._entry:main"
kan-mcp = "kan.mcp.server:main"

[dependency-groups]
dev = [
    "diff-cover>=9.0",
    "mypy>=2.1.0,<3",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line-too-long (中文 docstring 换行难，line-length=100 已够)
    "RUF001",  # 中文全角标点 (， 。 ：) — 中文 CLI 必然产物
    "RUF002",  # docstring 全角标点 — 同上
    "RUF003",  # comment 全角标点 — 同上
]

[tool.ruff.lint.per-file-ignores]
# test 函数名含 env var 名 (e.g., _KAN_COMPLETE / _TYPER_COMPLETE_ARGS) 是有意大写
# 保留 env var 字面量在函数名里 · 比改成 lowercase 更可读
"tests/test_atexit_completion_isolation.py" = ["N802"]

[tool.mypy]
python_version = "3.11"
files = ["kan/core", "kan/service", "kan/storage/export.py", "kan/data/updater.py", "kan/data/source_chain.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tty: true terminal PTY tests for Rich spinner/progress first-frame SLO",
    "network: 真网络冒烟 case · 默认 CI 跳 · 用 -m network 单独跑",
]

[tool.coverage.run]
source = ["kan"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.hatch.build.targets.wheel]
packages = ["kan"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
