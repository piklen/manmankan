<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="慢慢看 · manmankan · A 股自选股位置感 CLI">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>

  <!-- decorative terminal frame, top-right -->
  <g transform="translate(740, 80)" opacity="0.85">
    <rect x="0" y="0" width="380" height="240" rx="10" fill="#0a0a0a" stroke="#27272a" stroke-width="1"/>
    <rect x="0" y="0" width="380" height="32" rx="10" fill="#18181b"/>
    <rect x="0" y="22" width="380" height="10" fill="#18181b"/>
    <circle cx="20" cy="16" r="6" fill="#ef4444" opacity="0.7"/>
    <circle cx="40" cy="16" r="6" fill="#fbbf24" opacity="0.7"/>
    <circle cx="60" cy="16" r="6" fill="#34d399" opacity="0.7"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e4e4e7">
      <text x="20" y="60"><tspan fill="#34d399">$</tspan> kan scan</text>
      <text x="20" y="92" fill="#a1a1aa">600519 <tspan fill="#e4e4e7">茅台</tspan>   <tspan fill="#34d399" font-weight="bold">[38%]</tspan>  <tspan fill="#fbbf24" font-weight="bold">×2</tspan></text>
      <text x="20" y="114" fill="#a1a1aa">000858 <tspan fill="#e4e4e7">五粮液</tspan> <tspan fill="#34d399" font-weight="bold">[42%]</tspan>  <tspan fill="#fbbf24" font-weight="bold">×1</tspan></text>
      <text x="20" y="136" fill="#a1a1aa">000300 <tspan fill="#e4e4e7">沪深300</tspan> <tspan fill="#34d399" font-weight="bold">[2%]</tspan>   <tspan fill="#fbbf24" font-weight="bold">×6</tspan></text>
      <text x="20" y="158" fill="#a1a1aa">000016 <tspan fill="#e4e4e7">上证50</tspan>  <tspan fill="#34d399" font-weight="bold">[3%]</tspan>   <tspan fill="#fbbf24" font-weight="bold">×4</tspan></text>
      <text x="20" y="190" fill="#52525b">[x%] = 触及 N 日低点(≤5%)</text>
      <text x="20" y="210" fill="#52525b">×N  = 多周期共振</text>
    </g>
  </g>

  <!-- main title -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif">
    <text x="80" y="170" font-size="26" font-weight="500" fill="#34d399" letter-spacing="2">$ MANMANKAN · 慢慢看</text>

    <text x="80" y="290" font-size="86" font-weight="800" fill="#e4e4e7" letter-spacing="-2">告诉你它<tspan fill="url(#brand)">站在哪</tspan></text>
    <text x="80" y="380" font-size="58" font-weight="600" fill="#71717a" letter-spacing="-1">不告诉你买什么</text>

    <text x="80" y="465" font-size="24" fill="#a1a1aa">A 股自选股「位置感」CLI · 100% 本地 · source-available</text>

    <!-- bottom row -->
    <g transform="translate(80, 540)">
      <rect x="0" y="-30" width="380" height="48" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="20" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#e4e4e7"><tspan fill="#34d399">$</tspan> pip install manmankan</text>
    </g>

    <text x="1120" y="570" font-size="18" fill="#52525b" text-anchor="end">piklen.github.io/manmankan</text>
  </g>
</svg>
