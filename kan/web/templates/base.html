<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}慢慢看 Web{% endblock %}</title>
  <script src="/static/vendor/echarts.min.js"></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #64748b;
      --line: #d9e2ec;
      --accent: #0f766e;
      --accent-soft: #ccfbf1;
      --low: #047857;
      --high: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    header {
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .topbar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 20px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }
    .meta {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 22px 20px 32px;
    }
    .band {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .band + .band { margin-top: 18px; }
    .band-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      font-size: 15px;
      font-weight: 650;
    }
    .chart {
      width: 100%;
      height: 320px;
    }
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
      font-size: 14px;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      vertical-align: middle;
      white-space: nowrap;
    }
    th:first-child, td:first-child,
    th:nth-child(2), td:nth-child(2) {
      text-align: left;
    }
    th {
      color: var(--muted);
      font-weight: 650;
      background: #fbfcfd;
    }
    tr:last-child td {
      border-bottom: 0;
    }
    .code {
      color: var(--muted);
      font-size: 12px;
      margin-left: 6px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 6px;
      margin-left: 6px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
    }
    .pct-low { color: var(--low); font-weight: 650; }
    .pct-high { color: var(--high); font-weight: 650; }
    .empty {
      padding: 28px 16px;
      color: var(--muted);
      text-align: center;
    }
    footer {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 26px;
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 720px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
      .meta {
        white-space: normal;
      }
      main {
        padding: 16px 12px 28px;
      }
      footer {
        padding: 0 12px 22px;
      }
      .chart {
        height: 260px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <h1>慢慢看 Web</h1>
      <div class="meta">本地私有服务 · 127.0.0.1</div>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>{{ disclaimer }}</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
