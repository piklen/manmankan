version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-dev-tools:
        patterns:
          - "diff-cover"
          - "mypy"
          - "pytest*"
          - "ruff"
        update-types:
          - "minor"
          - "patch"
      python-runtime-non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "pandas"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "pyarrow"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typer"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      github-actions-non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
