name: Network Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'

permissions:
  contents: read

concurrency:
  group: network-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  KAN_NO_COMPLETION_AUTOINSTALL: "1"
  KAN_NO_UPDATE_CHECK: "1"

jobs:
  network-smoke:
    runs-on: [self-hosted, manmankan-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6 (pinned 2026-05-27)
      - name: Set up uv and Python
        run: bash scripts/ci/setup-uv.sh '3.12'
      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-extras
      - name: Run network-marked smoke tests
        run: uv run pytest -q -m network tests/network
