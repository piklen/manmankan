name: Test

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]

# v0.0.4.4: 显式声明最小权限 · 防 supply chain 投毒链
# (fork PR 中恶意 dep 借继承的 GITHUB_TOKEN 写仓库内容触发 release.yml)
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4 (pinned 2025-11-13)
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v4 (pinned 2024-11-30)
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run tests
        run: uv run pytest -q -m "not tty and not network"
      - name: Lint
        run: uv run ruff check kan/

  # CI 兜底跑禁词扫描 · 即使本地 pre-commit hook 未激活也能拦住
  privacy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Privacy / mental-model leaks scan
        run: bash scripts/check-privacy-leaks.sh

  # CI -m "not tty" 会排除 TTY 真测 · 补一个 TTY job 覆盖
  # spinner / Live Display first-frame SLO + 真 entry point 调用
  tty-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies + manmankan as tool
        run: |
          uv sync --all-extras
          uv tool install --reinstall .
      # v0.0.4.x catch-up fix: BSD script (macOS) vs util-linux script (Linux) 参数语法不兼容
      # Linux util-linux: script -q -c "<cmd>" <file>
      # macOS BSD:        script -q <file> <cmd...>  (无 -c flag · 直接 positional)
      # 彻底跨平台修法 (pexpect Python 库) 尚未实现 · 后续可加
      - name: TTY real terminal tests on Linux (util-linux script)
        if: runner.os == 'Linux'
        run: script -q -c "uv run pytest -q -m tty tests/test_cli_silent_period.py" /dev/null
      - name: TTY real terminal tests on macOS (BSD script)
        if: runner.os == 'macOS'
        run: script -q /dev/null uv run pytest -q -m tty tests/test_cli_silent_period.py
