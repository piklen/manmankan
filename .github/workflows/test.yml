name: Test

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]

# v0.0.4.4: 显式声明最小权限 · 防 supply chain 投毒链
# (fork PR 中恶意 dep 借继承的 GITHUB_TOKEN 写仓库内容触发 release.yml)
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4 (pinned 2025-11-13)
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v4 (pinned 2024-11-30)
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run tests
        run: uv run pytest -q -m "not tty"
      - name: Lint
        run: uv run ruff check kan/

  # v0.0.4.4: pre-commit hook 未激活 + CI 无禁词兜底
  # 历史背景: 早期 5 个 PyPI 版本含私人称谓泄漏 P0 · 防止此类失误零成本复发
  privacy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Privacy / mental-model leaks scan
        run: bash scripts/check-privacy-leaks.sh

  # v0.0.4.4 代码 CR Finding CR-1: CI -m "not tty" 排除真测 → 装机崩根因
  # TTY 真测覆盖 spinner / Live Display first-frame SLO + 真 entry point 调用
  tty-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies + manmankan as tool
        run: |
          uv sync --all-extras
          uv tool install --reinstall .
      - name: TTY real terminal tests (via script PTY wrapper)
        run: |
          # ubuntu 用 script · macos 也用 script (macOS 自带 script 命令)
          script -q -c "uv run pytest -q -m tty tests/test_cli_silent_period.py" /dev/null
