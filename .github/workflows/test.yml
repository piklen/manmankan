name: Test

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
      - 'refactor/**'
      - 'test/**'
      - 'codex/**'
      - 'dependabot/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

# 显式声明最小权限 · 防 supply chain 投毒链
# (fork PR 中恶意 dep 借继承的 GITHUB_TOKEN 写仓库内容触发 release.yml)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  KAN_NO_COMPLETION_AUTOINSTALL: "1"
  KAN_NO_UPDATE_CHECK: "1"

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6 (pinned 2026-05-27)
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # pinned 2026-05-27
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Lockfile is current
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-extras
      - name: Dependency upper-bound review
        run: uv run python scripts/check-dependency-bounds.py
      - name: Privacy / public archive scan
        run: bash scripts/check-privacy-leaks.sh
      - name: Lint source and tests
        run: uv run ruff check kan/ tests/
      - name: Type check core
        run: uv run mypy
      - name: Tracked package sanity
        run: |
          python - <<'PY'
          import subprocess
          import sys

          tracked = set(subprocess.check_output(["git", "ls-files"], text=True).splitlines())
          required = {
              "kan/data/__init__.py",
              "kan/cli/__init__.py",
              "kan/storage/export.py",
              "tests/test_ci_dependency_isolation.py",
              "uv.lock",
          }
          missing = sorted(required - tracked)
          if missing:
              print("Missing tracked package/test paths:")
              for path in missing:
                  print(f"  - {path}")
              sys.exit(1)
          PY
      - name: Build wheel and sdist
        run: |
          uv build --clear
          python - <<'PY'
          from pathlib import Path
          import sys

          dist = sorted(Path("dist").iterdir())
          has_wheel = any(p.suffix == ".whl" for p in dist)
          has_sdist = any(p.name.endswith(".tar.gz") for p in dist)
          if not has_wheel or not has_sdist:
              print("dist/ must contain both wheel and sdist:")
              for p in dist:
                  print(f"  - {p.name}")
              sys.exit(1)
          PY

  # 保留独立 job 名，避免已有 branch protection 仍绑定旧检查名时被误断。
  privacy-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6 (pinned 2026-05-27)
      - name: Privacy / public archive scan
        run: bash scripts/check-privacy-leaks.sh

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6 (pinned 2026-05-27)
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # pinned 2026-05-27
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-extras
      - name: Run tests
        run: uv run pytest -vv -m "not tty and not network" --durations=25 --durations-min=1.0

  # macOS hosted runners are the slowest and most failure-prone part of the matrix.
  # Full pytest runs on Ubuntu for both supported Python versions; macOS keeps targeted
  # platform smoke + TTY coverage so one runner class cannot block releases.
  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6 (pinned 2026-05-27)
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # pinned 2026-05-27
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-extras
      - name: macOS import and CLI smoke
        run: |
          uv run python - <<'PY'
          import importlib.metadata
          import platform

          import kan

          assert platform.system() == "Darwin"
          assert importlib.metadata.version("manmankan") == kan.__version__
          PY
          uv run kan --version
          uv run kan --help
          HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" NO_COLOR=1 uv run kan find --codes 600519,000858 --format json > /tmp/kan-find-code-pool.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/kan-find-code-pool.json").read_text())
          assert payload["mode"] == "code_pool"
          assert payload["ok"] is True
          assert payload["stats"]["matched"] == 2
          PY
      - name: Targeted macOS contract tests
        run: uv run pytest -q tests/test_help_cli.py tests/test_paths.py tests/test_find_json.py tests/test_api.py

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6 (pinned 2026-05-27)
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # pinned 2026-05-27
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Build package
        run: uv build --clear
      - name: Install wheel in clean environment
        run: |
          uv venv /tmp/manmankan-smoke --python ${{ matrix.python-version }}
          uv pip install --python /tmp/manmankan-smoke/bin/python dist/*.whl
      - name: Smoke installed entry points
        run: |
          /tmp/manmankan-smoke/bin/kan --version
          /tmp/manmankan-smoke/bin/kan --help
          /tmp/manmankan-smoke/bin/kan scan --help
          /tmp/manmankan-smoke/bin/kan find --help
          HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" NO_COLOR=1 /tmp/manmankan-smoke/bin/kan find --codes 600519,000858 --format json > /tmp/kan-find-code-pool.json
          NO_COLOR=1 /tmp/manmankan-smoke/bin/kan find --help > /tmp/kan-find-help.txt
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          text = re.sub(r"\x1b\[[0-9;]*m", "", Path("/tmp/kan-find-help.txt").read_text())
          assert "--compact" in text
          assert "--fields" in text
          payload = json.loads(Path("/tmp/kan-find-code-pool.json").read_text())
          assert payload["mode"] == "code_pool"
          assert payload["stats"]["matched"] == 2
          PY
          /tmp/manmankan-smoke/bin/kan board rank --help
          /tmp/manmankan-smoke/bin/kan history --help
          tmp="$(mktemp -d)"
          cd "$tmp"
          /tmp/manmankan-smoke/bin/python - <<'PY'
          from pathlib import Path
          import kan
          import importlib.metadata
          from kan.api import WatchlistSet, fetch, from_flags, scan

          assert kan.__version__
          assert importlib.metadata.version("manmankan") == kan.__version__
          assert Path(kan.__file__).resolve().is_relative_to(Path("/tmp/manmankan-smoke").resolve())
          assert WatchlistSet().name
          assert callable(scan)
          assert callable(fetch)
          assert callable(from_flags)
          PY

  # CI -m "not tty" 会排除 TTY 真测 · 补一个 TTY job 覆盖
  # spinner / Live Display first-frame SLO + 真 entry point 调用
  tty-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6 (pinned 2026-05-27)
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # pinned 2026-05-27
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies + manmankan as tool
        run: |
          uv sync --frozen --all-groups --all-extras
          uv tool install --reinstall .
      # 历史兼容修复: BSD script (macOS) vs util-linux script (Linux) 参数语法不兼容
      # Linux util-linux: script -q -c "<cmd>" <file>
      # macOS BSD:        script -q <file> <cmd...>  (无 -c flag · 直接 positional)
      # 彻底跨平台修法 (pexpect Python 库) 尚未实现 · 后续可加
      - name: TTY real terminal tests on Linux (util-linux script)
        if: runner.os == 'Linux'
        run: script -q -c "uv run pytest -q -m tty tests/test_cli_silent_period.py" /dev/null
      - name: TTY real terminal tests on macOS (BSD script)
        if: runner.os == 'macOS'
        run: script -q /dev/null uv run pytest -q -m tty tests/test_cli_silent_period.py
