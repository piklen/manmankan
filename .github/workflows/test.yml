name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  KAN_NO_COMPLETION_AUTOINSTALL: "1"
  KAN_NO_UPDATE_CHECK: "1"
  KAN_NO_NAMES_BACKGROUND_REFRESH: "1"
  PYTHONUTF8: "1"
  UV_LINK_MODE: "copy"
  UV_LOCK_TIMEOUT: "1200"
  UV_VERSION: "0.11.21"

jobs:
  quality-gates:
    name: Main verification (Linux / Python 3.12)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["ubuntu-latest"]' || '["self-hosted","manmankan-ci","hkg-vps"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup uv on fork runner
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Isolate local state and tool installation
        shell: bash
        run: |
          scope="$RUNNER_TEMP/kan-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$scope/data" "$scope/config" "$scope/cache" "$scope/tools" "$scope/bin"
          {
            echo "XDG_DATA_HOME=$scope/data"
            echo "XDG_CONFIG_HOME=$scope/config"
            echo "XDG_CACHE_HOME=$scope/cache"
            echo "UV_TOOL_DIR=$scope/tools"
            echo "UV_TOOL_BIN_DIR=$scope/bin"
          } >> "$GITHUB_ENV"
      - name: Install locked Python dependencies
        run: |
          uv lock --check
          uv sync --python 3.12 --frozen --all-groups
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/node-tool-cache
        with:
          node-version: '24'
      - name: Build and test Web UI
        working-directory: webui
        run: |
          npm ci
          npm test
          npm run build
      - name: Check generated API and bundled UI
        run: git diff --exit-code -- webui/openapi.json webui/src/api/schema.ts kan/web/spa
      - name: Source checks
        run: |
          bash scripts/check-privacy-leaks.sh
          uv run ruff check kan/ tests/
          uv run mypy
      - name: Functional regression tests
        run: uv run pytest -q -m "not tty and not network" -n 8 --dist worksteal --durations=10 --durations-min=1.0
      - name: Build and verify installed package
        shell: bash
        run: |
          uv build --clear
          smoke_env="$RUNNER_TEMP/manmankan-wheel-smoke"
          uv venv "$smoke_env" --python 3.12
          uv pip install --python "$smoke_env/bin/python" dist/*.whl
          "$smoke_env/bin/python" scripts/smoke-installed.py
          echo "$smoke_env/bin" >> "$GITHUB_PATH"
      - name: Real terminal verification
        run: script -q -e -c ".venv/bin/python -m pytest -q -m tty --tb=short tests/test_cli_silent_period.py" /dev/null
      - name: Clean CI runner workspace
        if: always()
        continue-on-error: true
        uses: ./.github/actions/cleanup-runner

  platform-install:
    name: Installed package (${{ matrix.os }} / Python 3.11)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.11'
          enable-cache: false
      - name: Build and install clean wheel
        shell: bash
        run: |
          uv build --clear
          uv venv .smoke --python 3.11
          if [ "$RUNNER_OS" = "Windows" ]; then
            smoke_python=".smoke/Scripts/python.exe"
          else
            smoke_python=".smoke/bin/python"
          fi
          uv pip install --python "$smoke_python" dist/*.whl
          "$smoke_python" scripts/smoke-installed.py
      - name: Check macOS native data dependency
        if: runner.os == 'macOS'
        shell: bash
        run: |
          .smoke/bin/python - <<'PY'
          from kan.infra.finalizer_guard import patch_mini_racer_import
          patch_mini_racer_import()
          from py_mini_racer import MiniRacer
          assert MiniRacer().eval("1 + 1") == 2
          PY
