name: Release to PyPI

on:
  push:
    tags: ['v*']

# 显式声明最小权限 · build-and-publish job 内部再细化
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  KAN_NO_COMPLETION_AUTOINSTALL: "1"
  KAN_NO_UPDATE_CHECK: "1"

jobs:
  macos-pre-publish-smoke:
    name: macOS clean wheel dependency smoke
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 (pinned 2026-07-14)
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # pinned 2026-05-27
        with:
          version: "0.11.21"
          python-version: '3.12'
          enable-cache: false
      - name: Build and install clean wheel
        run: |
          uv build --clear
          uv venv /tmp/manmankan-macos-smoke --python 3.12
          uv pip install --python /tmp/manmankan-macos-smoke/bin/python dist/*.whl
      - name: Verify MiniRacer ABI and retail entry
        run: |
          /tmp/manmankan-macos-smoke/bin/python - <<'PY'
          from importlib.metadata import packages_distributions

          owners = {
              name.lower().replace("_", "-")
              for name in packages_distributions().get("py_mini_racer", [])
          }
          assert not {"mini-racer", "py-mini-racer"} <= owners, owners
          from py_mini_racer import MiniRacer
          import akshare

          assert MiniRacer().eval("1 + 1") == 2
          assert callable(akshare.tool_trade_date_hist_sina)
          PY
          /tmp/manmankan-macos-smoke/bin/kan > /tmp/kan-start.txt
          grep "慢慢看 · 从一条明确规则开始" /tmp/kan-start.txt
          test "$(wc -l < /tmp/kan-start.txt)" -lt 40
          /tmp/manmankan-macos-smoke/bin/kan screen --help
          /tmp/manmankan-macos-smoke/bin/kan workspace --help

  build-and-publish:
    name: Build and publish to PyPI
    needs: macos-pre-publish-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      id-token: write  # trusted publisher OIDC
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 (pinned 2026-07-14)
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # pinned 2026-05-27
        with:
          version: "0.11.21"
          python-version: '3.12'
          enable-cache: true
      - name: Verify tag, version, and main tip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Release tags must be v<version>; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main --tags
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Release tag must point at origin/main tip" >&2
            echo "HEAD:        $(git rev-parse HEAD)" >&2
            echo "origin/main: $(git rev-parse origin/main)" >&2
            exit 1
          fi
          python - <<'PY'
          import re
          import sys
          import tomllib
          import os
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          init_text = Path("kan/__init__.py").read_text()
          init_match = re.search(r'__version__\s*=\s*"([^"]+)"', init_text)
          changelog = Path("CHANGELOG.md").read_text()
          changelog_match = re.search(r"^## \[(\d+(?:\.\d+){2,})\]", changelog, re.M)

          actual = {
              "tag": version,
              "pyproject": pyproject["project"]["version"],
              "__version__": init_match.group(1) if init_match else None,
              "CHANGELOG top": changelog_match.group(1) if changelog_match else None,
          }
          mismatches = {k: v for k, v in actual.items() if v != version}
          if mismatches:
              print("Release version mismatch:", actual, file=sys.stderr)
              sys.exit(1)
          PY
      - name: Lockfile is current
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-extras
      - name: Release privacy gate
        run: bash scripts/check-privacy-leaks.sh
      - name: Release test gate
        run: |
          uv run ruff check kan/ tests/
          uv run mypy
          uv run pytest -vv -m "not tty and not network" --durations=25 --durations-min=1.0
      - name: Build
        run: uv build --clear
      - name: Verify dist artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          dist = sorted(Path("dist").iterdir())
          has_wheel = any(p.suffix == ".whl" for p in dist)
          has_sdist = any(p.name.endswith(".tar.gz") for p in dist)
          if not has_wheel or not has_sdist:
              print("dist/ must contain both wheel and sdist:")
              for p in dist:
                  print(f"  - {p.name}")
              sys.exit(1)
          PY
      - name: Pre-publish clean wheel smoke
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          uv venv /tmp/manmankan-release-smoke --python 3.12
          uv pip install --python /tmp/manmankan-release-smoke/bin/python dist/*.whl
          SMOKE_CWD="$(mktemp -d)"
          cd "$SMOKE_CWD"
          HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" /tmp/manmankan-release-smoke/bin/kan --version | grep "kan ${VERSION}"
          HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" /tmp/manmankan-release-smoke/bin/kan --help
          HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" /tmp/manmankan-release-smoke/bin/kan scan --help
          HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" /tmp/manmankan-release-smoke/bin/kan find --help
          HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" /tmp/manmankan-release-smoke/bin/kan screen --help
          HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" /tmp/manmankan-release-smoke/bin/kan workspace --help
          HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" /tmp/manmankan-release-smoke/bin/kan board rank --help
          HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" /tmp/manmankan-release-smoke/bin/kan history --help
          FIND_JSON="$(mktemp)"
          FIND_ERR="$(mktemp)"
          export FIND_JSON
          HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" NO_COLOR=1 /tmp/manmankan-release-smoke/bin/kan find --codes 600519,000858 --format json > "$FIND_JSON" 2> "$FIND_ERR"
          test ! -s "$FIND_ERR"
          /tmp/manmankan-release-smoke/bin/python - <<'PY'
          import importlib.metadata
          import json
          import os
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          import kan
          from kan.web.app import SPA_INDEX

          assert importlib.metadata.version("manmankan") == version
          assert kan.__version__ == version
          assert Path(kan.__file__).resolve().is_relative_to(Path("/tmp/manmankan-release-smoke").resolve())
          assert SPA_INDEX.is_file()
          assert "/assets/index-" in SPA_INDEX.read_text(encoding="utf-8")
          payload = json.loads(Path(os.environ["FIND_JSON"]).read_text())
          assert payload["ok"] is True
          assert payload["command"] == "find"
          assert payload["result_schema"] == "full"
          assert payload["stats"]["matched"] == 2
          assert len(payload["results"]) == 2
          assert payload["disclaimer"]
          PY
      - name: Compute install.sh / install.ps1 SHA256
        run: |
          {
            echo "## install scripts SHA256 (for Verify before bash · 用户校验用)"
            echo '```'
            shasum -a 256 scripts/install.sh
            shasum -a 256 scripts/install.ps1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # pinned 2026-06-02
        with:
          packages-dir: dist/
          attestations: true  # sigstore PEP 740 attestation

  # 发版前 CI 测试 ≠ 装回来跑命令 · 历史上是安装后导入失败的成因之一
  # 这个 job 模拟用户视角: PyPI clean install → 跑 kan 核心命令 → 验证 import chain
  post-publish-smoke:
    name: Smoke test from PyPI (clean install)
    needs: build-and-publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        manager: [uv, pip]
        python: ['3.11', '3.12']
    steps:
      - name: Wait for PyPI CDN propagation
        run: sleep 60  # PyPI index 同步需要 30-60s
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # pinned 2026-06-02
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # pinned 2026-05-27
        with:
          version: "0.11.21"
          enable-cache: false
      - name: Install manmankan from PyPI (${{ matrix.manager }})
        run: |
          # ref_name 去掉前导 v 后得到包版本
          VERSION="${GITHUB_REF_NAME#v}"
          retry_install() {
            local attempt
            for attempt in 1 2 3 4 5 6; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" = 6 ]; then
                return 1
              fi
              echo "PyPI install not ready yet (attempt ${attempt}/6); retrying..."
              sleep 30
            done
          }
          case "${{ matrix.manager }}" in
            uv)
              retry_install uv tool install "manmankan==${VERSION}" --reinstall
              ;;
            pip)
              python -m venv /tmp/smoke-venv
              /tmp/smoke-venv/bin/python -m pip install --upgrade pip
              retry_install /tmp/smoke-venv/bin/python -m pip install --no-cache-dir "manmankan==${VERSION}"
              echo "/tmp/smoke-venv/bin" >> "$GITHUB_PATH"
              ;;
          esac
      - name: Verify kan entry point
        run: |
          kan --version
          KAN_NO_UPDATE_CHECK=1 kan --help
          KAN_NO_UPDATE_CHECK=1 kan scan --help
          KAN_NO_UPDATE_CHECK=1 kan find --help
          KAN_NO_UPDATE_CHECK=1 kan screen --help
          KAN_NO_UPDATE_CHECK=1 kan workspace --help
          NO_COLOR=1 KAN_NO_UPDATE_CHECK=1 kan find --help > /tmp/kan-find-help.txt
          python - <<'PY'
          import re
          from pathlib import Path

          text = re.sub(r"\x1b\[[0-9;]*m", "", Path("/tmp/kan-find-help.txt").read_text())
          assert "--compact" in text
          assert "--fields" in text
          PY
          KAN_NO_UPDATE_CHECK=1 kan board rank --help
          KAN_NO_UPDATE_CHECK=1 kan trend --help
          KAN_NO_UPDATE_CHECK=1 kan info --help
          KAN_NO_UPDATE_CHECK=1 kan history --help
