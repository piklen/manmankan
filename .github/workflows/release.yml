name: Release to PyPI

on:
  push:
    tags: ['v*']

# 显式声明最小权限 · build-and-publish job 内部再细化
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  KAN_NO_COMPLETION_AUTOINSTALL: "1"
  KAN_NO_UPDATE_CHECK: "1"

jobs:
  macos-pre-publish-smoke:
    name: macOS clean wheel dependency smoke
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 (pinned 2026-07-14)
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # pinned 2026-05-27
        with:
          version: "0.11.21"
          python-version: '3.12'
          enable-cache: false
      - name: Build and install clean wheel
        run: |
          uv build --clear
          uv venv /tmp/manmankan-macos-smoke --python 3.12
          uv pip install --python /tmp/manmankan-macos-smoke/bin/python dist/*.whl
      - name: Verify MiniRacer ABI and retail entry
        run: |
          /tmp/manmankan-macos-smoke/bin/python - <<'PY'
          from importlib.metadata import packages_distributions

          owners = {
              name.lower().replace("_", "-")
              for name in packages_distributions().get("py_mini_racer", [])
          }
          assert not {"mini-racer", "py-mini-racer"} <= owners, owners
          from py_mini_racer import MiniRacer
          import akshare

          assert MiniRacer().eval("1 + 1") == 2
          assert callable(akshare.tool_trade_date_hist_sina)
          PY
          /tmp/manmankan-macos-smoke/bin/python scripts/smoke-installed.py

  build-and-publish:
    name: Build and publish to PyPI
    needs: macos-pre-publish-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      id-token: write  # trusted publisher OIDC
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 (pinned 2026-07-14)
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # pinned 2026-05-27
        with:
          version: "0.11.21"
          python-version: '3.12'
          enable-cache: true
      - name: Verify tag, version, and main tip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Release tags must be v<version>; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main --tags
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Release tag must point at origin/main tip" >&2
            echo "HEAD:        $(git rev-parse HEAD)" >&2
            echo "origin/main: $(git rev-parse origin/main)" >&2
            exit 1
          fi
          python - <<'PY'
          import re
          import sys
          import tomllib
          import os
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          init_text = Path("kan/__init__.py").read_text()
          init_match = re.search(r'__version__\s*=\s*"([^"]+)"', init_text)
          changelog = Path("CHANGELOG.md").read_text()
          changelog_match = re.search(r"^## \[(\d+(?:\.\d+){2,})\]", changelog, re.M)

          actual = {
              "tag": version,
              "pyproject": pyproject["project"]["version"],
              "__version__": init_match.group(1) if init_match else None,
              "CHANGELOG top": changelog_match.group(1) if changelog_match else None,
          }
          mismatches = {k: v for k, v in actual.items() if v != version}
          if mismatches:
              print("Release version mismatch:", actual, file=sys.stderr)
              sys.exit(1)
          PY
      - name: Lockfile is current
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-extras
      - name: Release privacy gate
        run: bash scripts/check-privacy-leaks.sh
      - name: Release test gate
        run: |
          uv run ruff check kan/ tests/
          uv run mypy
          uv run pytest -q -m "not tty and not network" -n 2 --dist worksteal --durations=10
      - name: Build
        run: uv build --clear
      - name: Verify dist artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          dist = sorted(Path("dist").iterdir())
          has_wheel = any(p.suffix == ".whl" for p in dist)
          has_sdist = any(p.name.endswith(".tar.gz") for p in dist)
          if not has_wheel or not has_sdist:
              print("dist/ must contain both wheel and sdist:")
              for p in dist:
                  print(f"  - {p.name}")
              sys.exit(1)
          PY
      - name: Pre-publish clean wheel smoke
        run: |
          smoke_env="$RUNNER_TEMP/manmankan-release-smoke"
          uv venv "$smoke_env" --python 3.12
          uv pip install --python "$smoke_env/bin/python" dist/*.whl
          "$smoke_env/bin/python" scripts/smoke-installed.py
      - name: Compute install.sh / install.ps1 SHA256
        run: |
          {
            echo "## install scripts SHA256 (for Verify before bash · 用户校验用)"
            echo '```'
            shasum -a 256 scripts/install.sh
            shasum -a 256 scripts/install.ps1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # pinned 2026-07-29 · Core Metadata 2.5
        with:
          packages-dir: dist/
          attestations: true  # sigstore PEP 740 attestation

  # 代表组合覆盖最低 Python、原生数据依赖、Windows 入口与两种安装器。
  post-publish-smoke:
    name: Smoke test from PyPI (clean install)
    needs: build-and-publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            manager: pip
            python: '3.11'
          - os: macos-15-intel
            manager: uv
            python: '3.12'
          - os: windows-latest
            manager: pip
            python: '3.11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.11.21"
          enable-cache: false
      - name: Install and verify published package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          retry_install() {
            local attempt
            for attempt in 1 2 3 4 5 6; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" = 6 ]; then
                return 1
              fi
              echo "PyPI install not ready yet (attempt ${attempt}/6); retrying..."
              sleep 30
            done
          }
          if [ "${{ matrix.manager }}" = "uv" ]; then
            retry_install uv tool install --python "${{ matrix.python }}" "manmankan==${version}"
            smoke_python="$(uv tool dir)/manmankan/bin/python"
          else
            python -m venv .smoke
            if [ "$RUNNER_OS" = "Windows" ]; then
              smoke_python=".smoke/Scripts/python.exe"
            else
              smoke_python=".smoke/bin/python"
            fi
            retry_install "$smoke_python" -m pip install --no-cache-dir "manmankan==${version}"
          fi
          "$smoke_python" scripts/smoke-installed.py
