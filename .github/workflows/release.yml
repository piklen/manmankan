name: Release to PyPI

on:
  push:
    tags: ['v*']

# 显式声明最小权限 · build-and-publish job 内部再细化
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  KAN_NO_COMPLETION_AUTOINSTALL: "1"
  KAN_NO_UPDATE_CHECK: "1"

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write  # trusted publisher OIDC
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6 (pinned 2026-05-27)
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # pinned 2026-05-27
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Verify tag, version, and main tip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Release tags must be v<version>; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main --tags
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Release tag must point at origin/main tip" >&2
            echo "HEAD:        $(git rev-parse HEAD)" >&2
            echo "origin/main: $(git rev-parse origin/main)" >&2
            exit 1
          fi
          python - <<'PY'
          import re
          import sys
          import tomllib
          import os
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          init_text = Path("kan/__init__.py").read_text()
          init_match = re.search(r'__version__\s*=\s*"([^"]+)"', init_text)
          changelog = Path("CHANGELOG.md").read_text()
          changelog_match = re.search(r"^## \[(\d+\.\d+\.\d+(?:\.\d+)?)\]", changelog, re.M)

          actual = {
              "tag": version,
              "pyproject": pyproject["project"]["version"],
              "__version__": init_match.group(1) if init_match else None,
              "CHANGELOG top": changelog_match.group(1) if changelog_match else None,
          }
          mismatches = {k: v for k, v in actual.items() if v != version}
          if mismatches:
              print("Release version mismatch:", actual, file=sys.stderr)
              sys.exit(1)
          PY
      - name: Lockfile is current
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-extras
      - name: Release privacy gate
        run: bash scripts/check-privacy-leaks.sh
      - name: Release test gate
        run: |
          uv run ruff check kan/ tests/
          uv run mypy
          uv run pytest -q -m "not tty and not network"
      - name: Build
        run: uv build --clear
      - name: Verify dist artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          dist = sorted(Path("dist").iterdir())
          has_wheel = any(p.suffix == ".whl" for p in dist)
          has_sdist = any(p.name.endswith(".tar.gz") for p in dist)
          if not has_wheel or not has_sdist:
              print("dist/ must contain both wheel and sdist:")
              for p in dist:
                  print(f"  - {p.name}")
              sys.exit(1)
          PY
      - name: Pre-publish clean wheel smoke
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          uv venv /tmp/manmankan-release-smoke --python 3.12
          uv pip install --python /tmp/manmankan-release-smoke/bin/python dist/*.whl
          SMOKE_CWD="$(mktemp -d)"
          cd "$SMOKE_CWD"
          HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" /tmp/manmankan-release-smoke/bin/kan --version | grep "kan ${VERSION}"
          HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" /tmp/manmankan-release-smoke/bin/kan --help
          HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" /tmp/manmankan-release-smoke/bin/kan scan --help
          HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" /tmp/manmankan-release-smoke/bin/kan find --help
          HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" /tmp/manmankan-release-smoke/bin/kan board rank --help
          HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" /tmp/manmankan-release-smoke/bin/kan history --help
          FIND_JSON="$(mktemp)"
          FIND_ERR="$(mktemp)"
          export FIND_JSON
          HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" NO_COLOR=1 /tmp/manmankan-release-smoke/bin/kan find --codes 600519,000858 --format json > "$FIND_JSON" 2> "$FIND_ERR"
          test ! -s "$FIND_ERR"
          /tmp/manmankan-release-smoke/bin/python - <<'PY'
          import importlib.metadata
          import json
          import os
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          import kan

          assert importlib.metadata.version("manmankan") == version
          assert kan.__version__ == version
          assert Path(kan.__file__).resolve().is_relative_to(Path("/tmp/manmankan-release-smoke").resolve())
          payload = json.loads(Path(os.environ["FIND_JSON"]).read_text())
          assert payload["ok"] is True
          assert payload["mode"] == "code_pool"
          assert payload["stats"]["matched"] == 2
          PY
      - name: Compute install.sh / install.ps1 SHA256
        run: |
          echo "## install scripts SHA256 (for Verify before bash · 用户校验用)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          shasum -a 256 scripts/install.sh >> "$GITHUB_STEP_SUMMARY"
          shasum -a 256 scripts/install.ps1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # pinned 2026-06-02
        with:
          packages-dir: dist/
          attestations: true  # sigstore PEP 740 attestation

  # 发版前 CI 测试 ≠ 装回来跑命令 · 历史上是安装后导入失败的成因之一
  # 这个 job 模拟用户视角: PyPI clean install → 跑 kan 核心命令 → 验证 import chain
  post-publish-smoke:
    name: Smoke test from PyPI (clean install)
    needs: build-and-publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        manager: [uv, pip]
        python: ['3.11', '3.12']
    steps:
      - name: Wait for PyPI CDN propagation
        run: sleep 60  # PyPI index 同步需要 30-60s
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # pinned 2026-06-02
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # pinned 2026-05-27
      - name: Install manmankan from PyPI (${{ matrix.manager }})
        run: |
          # ref_name 去掉前导 v 后得到包版本
          VERSION="${GITHUB_REF_NAME#v}"
          case "${{ matrix.manager }}" in
            uv)
              uv tool install "manmankan==${VERSION}" --reinstall
              ;;
            pip)
              python -m venv /tmp/smoke-venv
              /tmp/smoke-venv/bin/pip install "manmankan==${VERSION}"
              echo "/tmp/smoke-venv/bin" >> "$GITHUB_PATH"
              ;;
          esac
      - name: Verify kan entry point
        run: |
          kan --version
          KAN_NO_UPDATE_CHECK=1 kan --help
          KAN_NO_UPDATE_CHECK=1 kan scan --help
          KAN_NO_UPDATE_CHECK=1 kan find --help
          NO_COLOR=1 KAN_NO_UPDATE_CHECK=1 kan find --help > /tmp/kan-find-help.txt
          python - <<'PY'
          import re
          from pathlib import Path

          text = re.sub(r"\x1b\[[0-9;]*m", "", Path("/tmp/kan-find-help.txt").read_text())
          assert "--compact" in text
          assert "--fields" in text
          PY
          KAN_NO_UPDATE_CHECK=1 kan board rank --help
          KAN_NO_UPDATE_CHECK=1 kan trend --help
          KAN_NO_UPDATE_CHECK=1 kan info --help
          KAN_NO_UPDATE_CHECK=1 kan history --help
