name: Dependabot Auto Merge

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Merge safe Dependabot updates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          pr_json="$(
            gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
              -H "Accept: application/vnd.github+json" \
              --jq 'map(select(.user.login == "dependabot[bot]" and .base.ref == "main" and .state == "open")) | .[0] // empty'
          )"
          if [ -z "${pr_json}" ]; then
            echo "No open Dependabot PR found for ${HEAD_SHA}; skip."
            exit 0
          fi

          number="$(jq -r '.number' <<<"${pr_json}")"
          title="$(jq -r '.title' <<<"${pr_json}")"
          body="$(jq -r '.body // ""' <<<"${pr_json}")"
          commit_message="$(gh api "repos/${REPO}/commits/${HEAD_SHA}" --jq '.commit.message')"
          metadata="${body}"$'\n'"${commit_message}"

          echo "PR #${number}: ${title}"

          if ! checks_json="$(gh pr checks "${number}" --repo "${REPO}" --json name,state,bucket,workflow)"; then
            echo "PR checks are not all green; skip."
            exit 0
          fi
          if [ "$(jq 'length' <<<"${checks_json}")" -eq 0 ]; then
            echo "PR has no checks; skip."
            exit 0
          fi
          if [ "$(jq '[.[] | select(.bucket != "pass")] | length' <<<"${checks_json}")" -ne 0 ]; then
            echo "PR has non-passing checks; skip."
            jq -r '.[] | select(.bucket != "pass") | "\(.workflow): \(.name) => \(.state)"' <<<"${checks_json}"
            exit 0
          fi

          allow="$(
            TITLE="${title}" BODY="${metadata}" python - <<'PY'
          import os
          import re

          title = os.environ["TITLE"]
          body = os.environ["BODY"]

          def title_is_semver_patch_or_minor() -> bool:
              match = re.search(
                  r"\bfrom v?(\d+)\.(\d+)\.(\d+) to v?(\d+)\.(\d+)\.(\d+)\b",
                  title,
              )
              if not match:
                  return False
              old = tuple(int(part) for part in match.group(1, 2, 3))
              new = tuple(int(part) for part in match.group(4, 5, 6))
              return old[0] == new[0] and new > old

          has_patch = "update-type: version-update:semver-patch" in body
          has_minor = "update-type: version-update:semver-minor" in body
          has_major = "update-type: version-update:semver-major" in body

          allow_ci = title.startswith("chore(ci)(deps):") and title_is_semver_patch_or_minor()
          allow_python_dev = (
              "dependency-type: direct:development" in body
              and not has_major
              and (has_patch or has_minor)
          )
          allow_python_prod = (
              "dependency-type: direct:production" in body
              and not has_major
              and not has_minor
              and has_patch
          )

          print("true" if allow_ci or allow_python_dev or allow_python_prod else "false")
          PY
          )"

          if [ "${allow}" != "true" ]; then
            echo "Dependabot update is outside the auto-merge policy; skip."
            exit 0
          fi

          gh pr merge "${number}" --repo "${REPO}" --squash --auto --delete-branch
