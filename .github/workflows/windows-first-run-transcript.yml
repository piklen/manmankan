name: Windows First Run Transcript

on:
  push:
    branches:
      - docs/windows-powershell-transcript
  workflow_dispatch:

permissions:
  contents: read

env:
  KAN_NO_COMPLETION_AUTOINSTALL: "1"
  UV_LINK_MODE: "copy"
  UV_LOCK_TIMEOUT: "1200"
  UV_NO_PROGRESS: "1"

jobs:
  transcript:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6 (pinned 2026-05-27)
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # pinned 2026-06-02
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # pinned 2026-05-27
        with:
          version: "0.11.21"
          enable-cache: false
      - name: Capture PowerShell first-run transcript
        run: |
          $ErrorActionPreference = "Stop"

          Write-Output '$ uv tool install manmankan'
          uv tool install manmankan --reinstall --force

          $toolBin = (uv tool dir --bin).Trim()
          $env:PATH = "$toolBin;$env:PATH"

          Write-Output '$ kan --version'
          kan --version

          Write-Output '$ $env:KAN_NO_UPDATE_CHECK = "1"'
          $env:KAN_NO_UPDATE_CHECK = "1"

          Write-Output '$ $env:PYTHONUTF8 = "1"'
          $env:PYTHONUTF8 = "1"
          Write-Output '$ $env:NO_COLOR = "1"'
          $env:NO_COLOR = "1"

          Write-Output '$ kan find --codes 600519,000858 --format json'
          kan find --codes 600519,000858 --format json

          Write-Output '$ uv tool install .'
          uv tool install . --reinstall --force
          if (Test-Path Env:PYTHONUTF8) {
            Remove-Item Env:PYTHONUTF8
          }

          Write-Output '$ kan find --codes 600519,000858 --format json  # source checkout, no PYTHONUTF8'
          kan find --codes 600519,000858 --format json
