# GitHub Pages · 自动部署 site/ 到 https://piklen.github.io/manmankan/
#
# 首次启用(一次性 · maintainer 在 GitHub web UI 操作):
#   Settings → Pages → Source = "GitHub Actions"
#
# 触发:
#   - push main 且 site/ 有变化
#   - 手动 dispatch (任何分支调试用)
#
# 部署机制:
#   现代 GitHub Pages action · 不需要 gh-pages 分支
#   site/ → artifact → Pages CDN

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6 (pinned 2026-05-27)

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5 (pinned 2026-05-27)

      - name: Upload site/ as Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5 (pinned 2026-05-27)
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5 (pinned 2026-05-27)
